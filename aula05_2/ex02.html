<!DOCTYPE html>
<!-- Documento HTML5 com o idioma definido para português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- A codificação aceita acentos, e viewport adapta a área de exibição à tela. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula 05_2 - Exercício 02 - Blocos com borda</title>
        <!-- O CSS externo desenha o quadro e posiciona seus dois blocos internos. -->
        <link rel="stylesheet" href="css/ex02.css">
    </head>
    <body>
        <!-- O quadro agrupa os blocos e, por ser posicionado no CSS, serve de referência a eles. -->
        <div class="quadro">
            <!-- As classes associam cada div às suas cores e coordenadas no quadro. -->
            <div class="vermelho"></div>
            <div class="azul"></div>
        </div>
    </body>
</html>
