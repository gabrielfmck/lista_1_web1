<!DOCTYPE html>
<!-- Documento HTML5 em português que demonstra divisões posicionadas e sobrepostas. -->
<html lang="pt-BR">
    <head>
        <!-- UTF-8 preserva os acentos, e viewport configura a área de exibição para a tela. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula 05_2 - Exercício 03 - Divisões posicionadas</title>
        <!-- A folha de estilos define o quadro amarelo e a posição de cada divisão. -->
        <link rel="stylesheet" href="css/ex03.css">
    </head>
    <body>
        <!-- O quadro é o ancestral posicionado usado como referência para as coordenadas internas. -->
        <div class="quadro">
            <!-- Os textos identificam os blocos; a posição visual de cada um é definida no CSS. -->
            <div class="div1">div1</div>
            <div class="div3">div3</div>
            <div class="div2">div2</div>
        </div>
    </body>
</html>
