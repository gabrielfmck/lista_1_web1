        <title>Aula 04 - Exercício 08 - Imagem de Fundo</title>
        <!-- Importa a folha externa que aplica a imagem de fundo ao elemento body. -->

    <body>
        <!-- Título e descrição ficam sobre o fundo definido pelo CSS, com a cor de texto herdada do body. -->

        <p>
            O fundo desta página é uma imagem de um céu estrelado, definida no arquivo CSS externo
