<!DOCTYPE html>
<!-- Declara um documento HTML5 cujo conteúdo está em português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- UTF-8 preserva os acentos e title identifica esta página na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 02 - Favicon</title>
        <!-- O favicon aparece ao lado do título, na aba do navegador -->
        <!-- rel identifica o ícone, type informa o formato ICO e href aponta para o arquivo local. -->
        <link rel="icon" type="image/x-icon" href="imagens/favicon.ico">
    </head>
    <body>
        <!-- Conteúdo visível que explica onde o favicon pode ser observado. -->
        <h1>Exercício 02 - Favicon personalizado</h1>
        <p>Observe a aba do navegador: o ícone azul com a letra "G" é o favicon desta página.</p>
    </body>
</html>
