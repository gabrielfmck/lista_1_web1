<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 07 - Decoração de Texto</title>
        <link rel="stylesheet" href="css/ex07.css">
    </head>
    <body>
        <h1>Exercício 07 - Decoração de texto</h1>

        <p class="sublinhado">
            Este primeiro parágrafo está sublinhado, ou seja, possui uma linha abaixo do texto.
        </p>
        <p class="linha-acima">
            Este segundo parágrafo possui uma linha acima do texto e uma indentação de 50px
            no início da primeira linha.
        </p>
        <p class="riscado">
            Este terceiro parágrafo possui uma linha no meio do texto.
        </p>
    </body>
</html>
