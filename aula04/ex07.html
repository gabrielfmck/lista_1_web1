<!DOCTYPE html>
<!-- Declara um documento HTML5 cujo conteúdo está em português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- Codificação dos caracteres e título apresentado na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 07 - Decoração de Texto</title>
        <!-- A folha externa define as decorações e o recuo de texto usados nesta atividade. -->
        <link rel="stylesheet" href="css/ex07.css">
    </head>
    <body>
        <h1>Exercício 07 - Decoração de texto</h1>

        <!-- A classe sublinhado ativa text-decoration: underline no CSS. -->
        <p class="sublinhado">
            Este primeiro parágrafo está sublinhado, ou seja, possui uma linha abaixo do texto.
        </p>
        <!-- A classe linha-acima combina uma linha superior com recuo na primeira linha. -->
        <p class="linha-acima">
            Este segundo parágrafo possui uma linha acima do texto e uma indentação de 50px
            no início da primeira linha.
        </p>
        <!-- A classe riscado acrescenta a linha que atravessa o texto. -->
        <p class="riscado">
            Este terceiro parágrafo possui uma linha no meio do texto.
        </p>
    </body>
</html>
