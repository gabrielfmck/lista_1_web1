<!DOCTYPE html>
<!-- Declara um documento HTML5 cujo conteúdo está em português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- Codificação dos caracteres e título apresentado na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 05 - Div's</title>
        <!-- A folha externa define os tamanhos, fundos e bordas das duas divisões. -->
        <link rel="stylesheet" href="css/ex05.css">
    </head>
    <body>
        <!-- div agrupa o conteúdo; a classe primeira aplica fundo laranja e bordas verdes. -->
        <div class="primeira">
            <!-- O atributo style aplica CSS diretamente ao título: texto centralizado e branco. -->
            <h1 style="text-align:center; color:white;">Primeira divisão</h1>
        </div>
        <!-- A classe segunda usa outro fundo e permite definir uma cor de borda para cada lado. -->
        <div class="segunda">
            <h1 style="text-align:center; color:white;">Segunda divisão</h1>
        </div>
    </body>
</html>
