<!DOCTYPE html>
<!-- Documento HTML5; lang informa o idioma do conteúdo ao navegador e aos leitores de tela. -->
<html lang="pt-BR">
    <head>
        <!-- UTF-8 permite exibir os acentos; title define o texto da aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 01 - Bandeiras</title>
        <!-- Importa a folha de estilos externa compartilhada com as páginas dos países. -->
        <link rel="stylesheet" href="css/paginas.css">
    </head>
    <body>
        <!-- Apresentação da atividade e orientação para usar as regiões clicáveis da imagem. -->
        <h1>Exercício 01 - Bandeiras da América Latina</h1>
        <p>Clique em uma bandeira de um país da América Latina para ver informações sobre ele.</p>

        <!-- Cada <area> é um retângulo: x1,y1 (canto superior esquerdo), x2,y2 (canto inferior direito) -->
        <!-- shape define a forma; coords usa pixels a partir do canto superior esquerdo da imagem; href indica o destino. -->
        <map name="bandeiras">
            <area shape="rect" coords="34,46,155,131" href="paises/brasil.html" alt="Brasil">
            <area shape="rect" coords="40,171,147,245" href="paises/mexico.html" alt="México">
            <area shape="rect" coords="170,177,286,252" href="paises/uruguai.html" alt="Uruguai">
            <area shape="rect" coords="308,177,425,254" href="paises/argentina.html" alt="Argentina">
            <area shape="rect" coords="577,412,695,484" href="paises/paraguai.html" alt="Paraguai">
        </map>

        <!-- usemap associa a imagem ao name do mapa; alt descreve a imagem quando ela não pode ser vista. -->
        <img src="imagens/bandeiras.jpg" usemap="#bandeiras" alt="Bandeiras de vários países">
    </body>
</html>
