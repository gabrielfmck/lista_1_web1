<!DOCTYPE html>
<!-- Declara um documento HTML5 cujo conteúdo está em português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- Codificação dos caracteres e título apresentado na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 06 - Alinhamento</title>
        <!-- Importa os estilos externos que definem fonte, fundos e alinhamento dos parágrafos. -->
        <link rel="stylesheet" href="css/ex06.css">
    </head>
    <body>
        <h1>Exercício 06 - Alinhamento de parágrafos</h1>

        <!-- As classes associam cada parágrafo a um valor de text-align: left, center ou right. -->
        <p class="esquerda">Este parágrafo está alinhado à esquerda.</p>
        <p class="centro">Este parágrafo está alinhado ao centro.</p>
        <p class="direita">Este parágrafo está alinhado à direita.</p>
    </body>
</html>
