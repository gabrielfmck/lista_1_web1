<!DOCTYPE html>
<!-- Declara um documento HTML5 cujo conteúdo está em português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- Codificação dos caracteres e título apresentado na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 03 - CSS Incorporado</title>
        <!-- CSS incorporado: as regras ficam no cabeçalho e valem só para esta página -->
        <style>
            /* O seletor p formata todos os parágrafos com fundo verde, texto branco e fonte de 16pt. */
            p {
                background-color: darkgreen;
                color: white;
                font-size: 16pt;
                font-family: Verdana, sans-serif;
            }
        </style>
    </head>
    <body>
        <!-- O título apresenta o exercício; o parágrafo recebe automaticamente as regras do seletor p. -->
        <h1>Exercício 03 - CSS incorporado</h1>

        <p>
            O HTML define a estrutura da página, enquanto o CSS define a sua aparência:
            cores, fontes, tamanhos e espaçamentos.
        </p>
    </body>
</html>
