<!DOCTYPE html>
<!-- Declara um documento HTML5 cujo conteúdo está em português do Brasil. -->
<html lang="pt-BR">
    <head>
        <!-- Codificação dos caracteres e título apresentado na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 04 - Exercício 04 - CSS Externo</title>
        <!-- rel="stylesheet" carrega as regras do arquivo CSS indicado pelo caminho relativo em href. -->
        <link rel="stylesheet" href="css/ex04.css">
    </head>
    <body>
        <h1>Exercício 04 - CSS externo</h1>

        <!-- Cada class seleciona um conjunto de regras da folha externa para este parágrafo. -->
        <p class="paragrafo1">
            Primeiro parágrafo: fundo amarelo, texto vermelho, fonte sans-serif de 16pt.
        </p>
        <!-- A classe paragrafo2 aplica a segunda combinação de cores, fonte e tamanho. -->
        <p class="paragrafo2">
            Segundo parágrafo: fundo preto, texto amarelo, fonte Arial de 14pt.
        </p>
        <!-- A classe paragrafo3 aplica a terceira combinação de estilos. -->
        <p class="paragrafo3">
            Terceiro parágrafo: fundo azul claro, texto azul escuro, fonte Courier de 12pt.
        </p>
    </body>
</html>
