<!DOCTYPE html>
<html lang="pt-BR">
    <!-- UTF-8 preserva os acentos; title identifica o exercício na aba do navegador. -->
    <head>
        <meta charset="UTF-8">
        <title>Aula 03 - Exercício 05</title>
        <style>
            /* A lista de seletores aplica bordas pretas de 1 pixel à tabela, às linhas e às células. */
            table, tr, td {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <h1>Exercício 05 - Tabela com Matrícula</h1>

        <!-- table organiza os dados em uma grade; o atributo width especifica a largura pretendida. -->
        <!-- tr cria uma linha e td cria uma célula; cada registro contém quatro colunas. -->
        <table width="500px">
            <!-- A primeira linha apresenta os rótulos das colunas, destacados visualmente com b. -->
            <tr>
                <td><b>Matrícula</b></td>
                <td><b>Nome</b></td>
                <td><b>Faltas</b></td>
                <td><b>Nota</b></td>
            </tr>
            <!-- As linhas seguintes armazenam matrícula, nome, faltas e nota de cada aluno. -->
            <tr>
                <td>11223344</td>
                <td>Pedro</td>
                <td>7</td>
                <td>83</td>
            </tr>
            <tr>
                <td>11223345</td>
                <td>Maria</td>
                <td>2</td>
                <td>91</td>
            </tr>
            <tr>
                <td>11223346</td>
                <td>João</td>
                <td>10</td>
                <td>65</td>
            </tr>
            <tr>
                <td>11223347</td>
                <td>Ana</td>
                <td>0</td>
                <td>98</td>
            </tr>
            <tr>
                <td>11223348</td>
                <td>Lucas</td>
                <td>4</td>
                <td>74</td>
            </tr>
            <tr>
                <td>11223349</td>
                <td>Juliana</td>
                <td>6</td>
                <td>80</td>
            </tr>
        </table>
    </body>
</html>
