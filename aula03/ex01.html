<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head define UTF-8 para exibir acentos e o título que aparece na aba do navegador. -->
    <head>
        <meta charset="UTF-8">
        <title>Aula 03 - Exercício 01</title>
    </head>
    <body>
        <h1>Exercício 01 - Listas aninhadas</h1>

        <!-- ul cria uma lista sem numeração; cada li da lista externa representa uma categoria. -->
        <ul>
            <li>Animais
                <!-- Uma lista dentro de li agrupa os itens que pertencem a esta categoria. -->
                <ul>
                    <li>Cachorro</li>
                    <li>Gato</li>
                    <li>Coelho</li>
                </ul>
            </li>
            <li>Frutas
                <!-- A lista interna mantém as frutas subordinadas ao item Frutas. -->
                <ul>
                    <li>Maçã</li>
                    <li>Banana</li>
                    <li>Laranja</li>
                </ul>
            </li>
            <li>Cores
                <!-- Este último grupo segue a mesma estrutura de lista aninhada. -->
                <ul>
                    <li>Vermelho</li>
                    <li>Verde</li>
                    <li>Azul</li>
                </ul>
            </li>
        </ul>
    </body>
</html>
