<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head contém os metadados da página e as regras de estilo usadas neste exercício. -->
    <head>
        <meta charset="UTF-8">
        <title>Aula 03 - Exercício 04</title>
        <style>
            /* O seletor ol altera o formato da numeração de todas as listas ordenadas da página. */
            ol {
                list-style-type: upper-roman; /* I, II, III, IV, V */
            }
        </style>
    </head>
    <body>
        <h1>Exercício 04 - Números romanos</h1>

        <!-- ol mantém a ordem das etapas; os itens li recebem algarismos romanos pelo CSS. -->
        <ol>
            <li>Ler o enunciado</li>
            <li>Planejar a solução</li>
            <li>Codificar</li>
            <li>Testar</li>
            <li>Entregar</li>
        </ol>
    </body>
</html>
