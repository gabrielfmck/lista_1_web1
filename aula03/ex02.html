<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head reúne a codificação, o título da aba e o CSS incorporado ao documento. -->
    <head>
        <meta charset="UTF-8">
        <title>Aula 03 - Exercício 02</title>
        <style>
            /* O seletor ul aplica a aparência dos marcadores a todas as listas não ordenadas da página. */
            ul {
                list-style-type: circle; /* marcador em forma de círculo vazio */
            }
        </style>
    </head>
    <body>
        <h1>Exercício 02 - Marcador circle</h1>

        <!-- ul agrupa uma lista sem ordem numérica; li define cada linguagem exibida com o marcador circle. -->
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
        </ul>
    </body>
</html>
