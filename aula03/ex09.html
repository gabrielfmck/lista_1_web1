<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Aula 03 - Exercício 09</title>
        <style>
            table {
                width: 100%;
                border-collapse: collapse;      /* remove o espaço entre as bordas */
                font-family: Arial, sans-serif;
                font-size: 11pt;
                color: #333333;
            }
            th, td {
                border: 1px solid black;
                padding: 25px 10px;
                text-align: center;
            }
            th {
                background-color: #0b4fa8;      /* azul do cabeçalho */
                color: white;
            }
            td.esquerda {
                text-align: left;               /* primeira coluna alinhada à esquerda */
            }
            tr:nth-child(even) {
                background-color: #a9d3fd;      /* linhas pares em azul claro */
            }
        </style>
    </head>
    <body>
        <h1>Exercício 09 - Tabela do Imposto de Renda</h1>

        <table>
            <thead>
                <tr>
                    <th>Base de cálculo mensal em R$</th>
                    <th>Alíquota %</th>
                    <th>Parcela a deduzir do imposto em R$</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="esquerda">Até 1.903,98</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td class="esquerda">De 1.903,99 até 2.826,65</td>
                    <td>7,5</td>
                    <td>142,80</td>
                </tr>
                <tr>
                    <td class="esquerda">De 2.826,66 até 3.751,05</td>
                    <td>15,0</td>
                    <td>354,80</td>
                </tr>
                <tr>
                    <td class="esquerda">De 3.751,06 até 4.664,68</td>
                    <td>22,5</td>
                    <td>636,13</td>
                </tr>
                <tr>
                    <td class="esquerda">Acima de 4.664,68</td>
                    <td>27,5</td>
                    <td>869,36</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
