<!DOCTYPE html>
<!-- Documento HTML5 em português que demonstra um layout com áreas nomeadas no CSS Grid. -->
<html lang="pt-BR">
    <head>
        <!-- A codificação UTF-8 aceita acentos, e o título aparece na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 06 - Exercício CSS Grid</title>
        <!-- A folha externa define as linhas, colunas e áreas da grade. -->
        <link rel="stylesheet" href="css/grid.css">
    </head>
    <body>
        <!-- Os filhos diretos deste contêiner se tornam os itens da grade. -->
        <div class="grid-container">
            <!-- Cada grid-area no estilo inline associa o item a um nome de grid-template-areas no CSS. -->
            <div class="item" style="grid-area: item-1"> Item 1</div>
            <div class="item" style="grid-area: item-2"> Item 2</div>
            <div class="item" style="grid-area: item-3"> Item 3</div>
            <div class="item" style="grid-area: item-4"> Item 4</div>
            <div class="item" style="grid-area: item-5"> Item 5</div>
            <div class="item" style="grid-area: item-6"> Item 6</div>
            <div class="item" style="grid-area: item-7"> Item 7</div>
            <div class="item" style="grid-area: item-8"> Item 8</div>
        </div>
    </body>
</html>
