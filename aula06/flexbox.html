<!DOCTYPE html>
<!-- Documento HTML5 em português com uma coleção de imagens organizada por Flexbox. -->
<html lang="pt-BR">
    <head>
        <!-- UTF-8 permite acentos; o título identifica a página na aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 06 - Exercício FlexBox</title>
        <!-- A folha externa transforma o body e cada caixa em contêineres flexíveis. -->
        <link rel="stylesheet" href="css/flexbox.css">
    </head>
    <body>
        <!-- Cada div é um item do Flexbox do body e contém uma imagem centralizada pelo CSS. -->
        <!-- src indica o arquivo local; alt descreve a imagem para acessibilidade e falhas de carregamento. -->
        <div class="caixa"><img src="imagens/guitarra.jpg" alt="Guitarra elétrica"></div>
        <div class="caixa"><img src="imagens/violino.png" alt="Violino"></div>
        <div class="caixa"><img src="imagens/ukulele.jpg" alt="Ukulele"></div>
        <div class="caixa"><img src="imagens/microfone.jpg" alt="Microfone"></div>
        <div class="caixa"><img src="imagens/fone.jpg" alt="Fone de ouvido"></div>
        <div class="caixa"><img src="imagens/trompete.jpg" alt="Trompete"></div>
    </body>
</html>
