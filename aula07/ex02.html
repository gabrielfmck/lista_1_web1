<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <!-- Configura os caracteres acentuados e o título da aba do navegador. -->
        <meta charset="UTF-8">
        <title>Aula 07 - Exercício 02 - Adicionar Item</title>
    </head>
    <body>
        <!-- Inclusão do arquivo JavaScript externo -->
        <script src="js/ex02.js"></script>

        <h1>Exercício 02 - Lista de compras</h1>

        <!-- O id permite que o script encontre esta lista; ela já contém o primeiro item. -->
        <ul id="lista">
            <li>Item 1</li>
        </ul>

        <!-- O clique executa a função definida no arquivo js/ex02.js. -->
        <button onclick="adicionarItem()">Adicionar item</button>
    </body>
</html>
