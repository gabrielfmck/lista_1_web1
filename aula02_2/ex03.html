<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head reúne os metadados: UTF-8 preserva acentos e title aparece na aba do navegador. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 03</title>
    </head>
    <body>
        <!-- O título principal e o link abaixo formam o conteúdo visível da página. -->
        <h1>Exercício 03</h1>

        <!-- O destino de href é um PDF, que o navegador pode abrir conforme suas configurações. -->
        <!-- URL relativa: o arquivo está na mesma pasta desta página -->
        <a href="documento.pdf">Abrir o documento.pdf</a>
    </body>
</html>
