<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head define a codificação do texto e o título exibido na aba. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 04</title>
    </head>
    <body>
        <!-- h1 identifica o exercício e p apresenta a instrução em um parágrafo. -->
        <h1>Exercício 04</h1>
        <p>Clique na imagem da Terra para visitar o site da NASA.</p>

        <!-- Imagem como link: a tag <img> fica dentro da tag <a> -->
        <a href="https://www.nasa.gov">
            <!-- src procura a imagem na subpasta imagens; alt descreve seu conteúdo. -->
            <!-- width e height definem as dimensões exibidas em pixels. -->
            <img src="imagens/terra.jpg" alt="Planeta Terra visto do espaço" width="250" height="250">
        </a>
    </body>
</html>
