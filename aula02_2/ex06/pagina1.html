<!DOCTYPE html>
<html lang="pt-BR">
    <!-- UTF-8 preserva os acentos e title define o título da aba desta galeria. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 06 - Página 1</title>
    </head>
    <body>
        <!-- O título principal e o parágrafo orientam a navegação pelas imagens. -->
        <h1>Página 1 - Animais</h1>
        <p>Clique em uma imagem para ver a descrição.</p>

        <!-- Cada imagem está dentro de um link relativo para a página de detalhes do animal. -->
        <!-- src usa a subpasta imagens, alt descreve a foto e width/height definem suas dimensões em pixels. -->
        <a href="gato.html">
            <img src="imagens/gato.jpg" alt="Foto de um gato" width="250" height="200">
        </a>
        <a href="cachorro.html">
            <img src="imagens/cachorro.jpg" alt="Foto de um cachorro" width="250" height="200">
        </a>
        <a href="leao.html">
            <img src="imagens/leao.jpg" alt="Foto de um leão" width="250" height="200">
        </a>
    </body>
</html>
