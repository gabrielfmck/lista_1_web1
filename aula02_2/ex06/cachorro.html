<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head configura a codificação UTF-8 e o nome desta página na aba do navegador. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 06 - Cachorro</title>
    </head>
    <body>
        <!-- h1 identifica o animal apresentado nesta página de detalhes. -->
        <h1>Cachorro</h1>
        <!-- src aponta para a subpasta imagens; alt descreve a foto e width define sua largura em pixels. -->
        <img src="imagens/cachorro.jpg" alt="Foto de um cachorro" width="400">
        <!-- p agrupa a descrição do animal em um parágrafo. -->
        <p>O cachorro foi um dos primeiros animais domesticados pelo ser humano. Possui olfato e audição muito apurados e existem centenas de raças, de tamanhos e temperamentos bem diferentes. É conhecido como o melhor amigo do homem.</p>
