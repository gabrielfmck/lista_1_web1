<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head configura a codificação UTF-8 e o nome desta página na aba do navegador. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 06 - Gato</title>
    </head>
    <body>
        <!-- h1 identifica o animal apresentado nesta página de detalhes. -->
        <h1>Gato</h1>
        <!-- src aponta para a subpasta imagens; alt descreve a foto e width define sua largura em pixels. -->
        <img src="imagens/gato.jpg" alt="Foto de um gato" width="400">
        <!-- p agrupa a descrição do animal em um parágrafo. -->
        <p>O gato doméstico é um mamífero carnívoro da família dos felinos. É um animal independente, curioso e muito ágil, conhecido por passar boa parte do dia dormindo e por manter a higiene lambendo o próprio pelo.</p>

        <!-- O link relativo retorna ao arquivo pagina1.html, localizado na mesma pasta. -->
        <a href="pagina1.html">Voltar</a>
    </body>
</html>
