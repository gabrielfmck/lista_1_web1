<!DOCTYPE html>
<html lang="pt-BR">
    <!-- O idioma ajuda tecnologias assistivas; head configura a codificação e o título da aba. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 02</title>
    </head>
    <body>
        <!-- h1 apresenta o título principal do exercício. -->
        <h1>Exercício 02</h1>

        <!-- href define o destino da navegação; o texto entre as tags é o rótulo clicável. -->
        <!-- URL absoluta: endereço completo do site -->
        <a href="https://www.google.com">Ir para o Google</a>
    </body>
</html>
