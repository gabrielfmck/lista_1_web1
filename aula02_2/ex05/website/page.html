<!DOCTYPE html>
<html lang="pt-BR">
    <!-- head contém a codificação UTF-8 e o título usado na aba do navegador. -->
    <head>
        <meta charset="UTF-8">
        <title>Exercício 05 - page.html</title>
    </head>
    <body>
        <!-- h1 identifica a página e os elementos a oferecem navegação entre os arquivos. -->
        <h1>Página (page.html)</h1>

        <!-- href usa caminhos relativos à pasta website; br coloca o próximo link em outra linha. -->
        <!-- index.html está na mesma pasta -->
        <a href="index.html">Acessar index.html</a> <br>
        <!-- team.html está dentro da pasta about -->
        <a href="about/team.html">Acessar team.html</a>
    </body>
</html>
